name: Tests et image Docker (GHCR)

# Tests et construction de l'image en parallèle. L'image est d'abord poussée sous l'étiquette
# « sha-<commit> » uniquement ; les étiquettes « latest » / version ne lui sont ajoutées (sans
# reconstruction) que si les tests ont réussi.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Publication depuis la branche par défaut ou un tag v* (jamais depuis une pull request).
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests unitaires (faux fournisseur Xtream local)
        run: python -m unittest discover -s tests -t . -v
      - name: Vérification de la syntaxe JavaScript
        run: node --check app/static/app.js
      - name: Aucun identifiant réel dans le dépôt
        run: |
          ! git grep -nIE '[?&](username|password)=[A-Za-z0-9]{6,}' -- ':!tests' ':!*.md' || { echo "Identifiant suspect"; exit 1; }

  build:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.candidate.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquette candidate
        id: candidate
        run: echo "ref=${IMAGE,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - name: Construction (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.candidate.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Publication non demandée pour cette branche
        if: env.PUBLISH != 'true'
        run: echo "Image testée mais non publiée (branche non par défaut)."
      - uses: docker/setup-buildx-action@v3
        if: env.PUBLISH == 'true'
      - name: Connexion à GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes finales
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Promotion de l'image testée (sans reconstruction)
        if: env.PUBLISH == 'true' && steps.meta.outputs.tags != ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE: ${{ needs.build.outputs.candidate }}
        run: |
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "${tag,,}"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$CANDIDATE"
