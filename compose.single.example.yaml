# MODE SIMPLE : un seul fichier à modifier, sans .env.
#   cp compose.single.example.yaml compose.single.yaml   (compose.single.yaml est ignoré par Git)
#   -> remplace les 3 valeurs XTREAM_* ci-dessous
#   docker compose -f compose.single.yaml up -d --build
services:
  xtream-m3u-local:
    build: .
    image: xtream-m3u-local:latest
    container_name: xtream-m3u-local
    restart: unless-stopped
    ports:
      - "7777:7777"
      - "7778:7778"
    environment:
      XTREAM_URL: "http://ADRESSE_DU_SERVEUR:80"
      XTREAM_USERNAME: "MON_UTILISATEUR"
      XTREAM_PASSWORD: "MON_MOT_DE_PASSE"
      # Facultatif :
      # WEB_PASSWORD: "mot-de-passe-interface"   # protège le port 7778 (utilisateur : admin)
      # ACCESS_TOKEN: "jeton-lecteurs"           # exige ?token=... sur le port 7777
      # PUBLIC_BASE_URL: "http://192.168.1.10:7777"
      TZ: "Europe/Paris"
    volumes:
      - ./data:/data
