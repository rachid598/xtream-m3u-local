# Déploiement standard : `cp .env.example .env`, renseigner les 3 variables XTREAM_*, puis
#   docker compose up -d --build
services:
  xtream-m3u-local:
    build: .
    image: xtream-m3u-local:latest
    container_name: xtream-m3u-local
    restart: unless-stopped
    ports:
      - "7777:7777"   # lecteurs IPTV : /p/<nom>.m3u, /playlist.m3u, /stream/<id>.ts, EPG
      - "7778:7778"   # interface Web de gestion
    environment:
      XTREAM_URL: "${XTREAM_URL:?Renseigner XTREAM_URL dans .env}"
      XTREAM_USERNAME: "${XTREAM_USERNAME:?Renseigner XTREAM_USERNAME dans .env}"
      XTREAM_PASSWORD: "${XTREAM_PASSWORD:?Renseigner XTREAM_PASSWORD dans .env}"
      # Facultatif (valeurs par défaut adaptées à un usage local) :
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      ACCESS_TOKEN: "${ACCESS_TOKEN:-}"
      WEB_USERNAME: "${WEB_USERNAME:-admin}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      ENABLE_EPG: "${ENABLE_EPG:-true}"
      # auto = xmltv.php complété par l'API chaîne par chaîne ; xmltv = xmltv.php seul ; api = API seule
      EPG_SOURCE: "${EPG_SOURCE:-auto}"
      # Facultatif : guide XMLTV externe à la place de xmltv.php (http(s), .xml ou .xml.gz)
      EPG_URL: "${EPG_URL:-}"
      CACHE_SECONDS: "${CACHE_SECONDS:-1800}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-auto}"
      STREAM_TAKEOVER: "${STREAM_TAKEOVER:-true}"
      FAILOVER_STALL_SECONDS: "${FAILOVER_STALL_SECONDS:-6}"
      FAILOVER_SLOW_PERCENT: "${FAILOVER_SLOW_PERCENT:-35}"
      FAILOVER_RETURN_MINUTES: "${FAILOVER_RETURN_MINUTES:-10}"
      FAILOVER_MODE: "${FAILOVER_MODE:-reconnect}"
      REMOTE_ACCESS: "${REMOTE_ACCESS:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      WEB_REMOTE: "${WEB_REMOTE:-false}"
      LOCAL_NETWORKS: "${LOCAL_NETWORKS:-}"
      LOGO_COUNTRIES: "${LOGO_COUNTRIES:-FR,BE,MA}"
      PROVIDER_TIMEZONE: "${PROVIDER_TIMEZONE:-}"
      XTREAM_NAME: "${XTREAM_NAME:-}"
      # Abonnement supplémentaire facultatif (catalogues fusionnés) ; jusqu'à _9
      XTREAM_URL_2: "${XTREAM_URL_2:-}"
      XTREAM_USERNAME_2: "${XTREAM_USERNAME_2:-}"
      XTREAM_PASSWORD_2: "${XTREAM_PASSWORD_2:-}"
      XTREAM_NAME_2: "${XTREAM_NAME_2:-}"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      # Sauvegarde des playlists (/data/playlists.json) et cache EPG.
      # Sur Unraid : DATA_PATH=/mnt/user/appdata/xtream-m3u-local (ou le chemin du pool NVMe).
      - "${DATA_PATH:-./data}:/data"
